<style>
:root{
  --bg:#0d0d0d;--bg-el:#181818;--bg-surf:#222;

}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:Inter,sans-serif;line-height:1.6;overflow-x:hidden}

/* UTILITIES */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .8s cubic-bezier(.16,1,.3,1) both}
.fade-in:nth-child(2){animation-delay:.1s}
.fade-in:nth-child(3){animation-delay:.2s}
.container{max-width:1100px;margin:0 auto;padding:0 1.5rem}
.line-combat{width:48px;height:2px;background:var(--combat);margin-bottom:1.25rem}
.text-gradient{background:linear-gradient(135deg,var(--combat) 30%,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 24px rgba(196,21,21,.35)}50%{box-shadow:0 0 40px rgba(196,21,21,.55)}}
.glow{animation:pulse-glow 2.5s ease-in-out infinite}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.9rem 1.8rem;border-radius:6px;font-weight:700;font-size:.875rem;text-decoration:none;border:none;cursor:pointer;letter-spacing:.04em;transition:all .2s}
.btn-primary{background:var(--combat);color:#fff}
.btn-primary:hover{background:var(--combat-h);transform:translateY(-2px)}
.btn-outline{border:1px solid rgba(255,255,255,.15);color:var(--fg-m)}
.btn-outline:hover{border-color:rgba(255,255,255,.4);color:var(--fg)}
.section-label{font-size:.7rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--combat);display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
.section-label::before{content:'';width:24px;height:1px;background:var(--combat)}

.section-lead{color:var(--fg-m);font-size:1rem;line-height:1.75;max-width:540px}

/* LOGO */
.logo-wrap{display:flex;align-items:center;text-decoration:none;flex-shrink:0}
.logo-img{height:56px;width:auto;display:block}

/* HEADER */
header{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .3s}
header.scrolled{background:rgba(13,13,13,.94);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
nav.desktop-nav{display:flex;align-items:center;gap:2rem}
nav.desktop-nav a{color:var(--fg-m);font-size:.8rem;font-weight:500;text-decoration:none;letter-spacing:.08em;text-transform:uppercase;transition:color .2s}

/* HERO */

.hero-title .line1{display:block;color:var(--fg)}
.hero-title .line2{display:block;color:var(--combat)}
.hero-title .line3{display:block;color:rgba(240,240,240,.3);font-size:clamp(1.8rem,5vw,3.5rem)}

50%{opacity:1;transform:scaleY(1)}}

.course-tag{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--combat);margin-bottom:.5rem}
.course-name{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;color:#fff;margin-bottom:.5rem}
.course-desc{font-size:.82rem;color:rgba(255,255,255,.65);line-height:1.6}
.courses-wide{grid-column:1/-1;height:260px}

/* BENEFITS */

.benefit-item{display:flex;gap:1.25rem;align-items:flex-start}

.benefit-title{font-size:1rem;font-weight:700;margin-bottom:.35rem}
.benefit-desc{color:var(--fg-m);font-size:.875rem;line-height:1.7}

/* CERTIFICATIONS */
#certifications{padding:7rem 1.5rem}
.certif-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--border);margin-top:3rem}
.certif-item{background:var(--bg);padding:2rem;display:flex;gap:1rem;align-items:flex-start;transition:background .2s}
.certif-item:hover{background:var(--bg-el)}
.certif-icon-wrap{width:36px;height:36px;flex-shrink:0;border:1px solid rgba(196,21,21,.3);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--combat)}
.certif-name{font-size:.9rem;font-weight:700;margin-bottom:.2rem}
.certif-detail{font-size:.75rem;color:var(--fg-s);line-height:1.5}

/* COACH */
#coach{padding:7rem 1.5rem;background:var(--bg-el)}
.coach-layout{display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center}
.coach-img-wrap{position:relative}


.coach-badge{position:absolute;bottom:2rem;right:-2rem;background:var(--combat);color:#fff;padding:1rem 1.5rem;border-radius:4px;text-align:center}
.coach-badge-num{font-size:2.5rem;font-weight:900;line-height:1}
.coach-badge-txt{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.coach-text h2{font-size:clamp(1.8rem,3vw,2.4rem);font-weight:800;letter-spacing:-.03em;margin-bottom:1.5rem;line-height:1.1}
.coach-text p{color:var(--fg-m);line-height:1.85;margin-bottom:1.25rem;font-size:.9rem}
.cred-grid{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem}
.cred-tag{font-size:.72rem;font-weight:600;color:var(--fg-m);border:1px solid var(--border);padding:.3rem .75rem;border-radius:3px;letter-spacing:.03em}
.link-combat{display:inline-flex;align-items:center;gap:.4rem;color:var(--combat);text-decoration:none;font-size:.85rem;font-weight:700;margin-top:1.5rem;letter-spacing:.04em}
.link-combat:hover{text-decoration:underline}

/* PRICING */
#tarifs{padding:7rem 1.5rem}
.pricing-table{margin-top:3rem;border:1px solid var(--border)}
.pricing-row{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;align-items:center;border-bottom:1px solid var(--border);transition:background .2s}
.pricing-row:last-child{border-bottom:none}
.pricing-row:hover{background:var(--bg-el)}
.pricing-row-header{background:var(--bg-el);font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--fg-s)}
.pricing-row > div{padding:1.25rem 1.5rem}
.pricing-name{font-weight:700;font-size:.95rem}
.pricing-detail{font-size:.78rem;color:var(--fg-s);margin-top:.2rem}
.pricing-price{font-size:1.8rem;font-weight:900;letter-spacing:-.03em;color:var(--combat)}
.pricing-price small{font-size:.7rem;font-weight:500;color:var(--fg-s)}
.pricing-badge{display:inline-flex;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(196,21,21,.1);border:1px solid rgba(196,21,21,.25);color:var(--combat);padding:.25rem .6rem;border-radius:3px}

/* PACKS */
#packs{padding:0 1.5rem 7rem}
.packs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.pack-card{background:var(--bg);padding:2.5rem 2rem;position:relative;transition:background .2s}
.pack-card:hover{background:var(--bg-el)}
.pack-card.featured{background:rgba(196,21,21,.06)}
.pack-card.featured::before{content:'POPULAIRE';position:absolute;top:1.25rem;right:1.25rem;font-size:.6rem;font-weight:800;letter-spacing:.15em;color:var(--combat);border:1px solid var(--combat);padding:.2rem .5rem}
.pack-name{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.25rem}
.pack-sub{font-size:.78rem;color:var(--fg-s);margin-bottom:1.75rem}
.pack-price{font-size:3.5rem;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--fg);margin-bottom:.25rem}
.pack-credits{font-size:.78rem;color:var(--fg-s);margin-bottom:1.5rem}
.pack-save{font-size:.72rem;font-weight:700;color:var(--gold);margin-bottom:1.5rem;display:block}
.pack-list{list-style:none;border-top:1px solid var(--border);padding-top:1.5rem;display:flex;flex-direction:column;gap:.6rem}
.pack-list li{font-size:.82rem;color:var(--fg-m);display:flex;align-items:center;gap:.6rem}
.pack-list li::before{content:'→';color:var(--combat);font-size:.75rem;flex-shrink:0}

/* CONTACT */
#contact{padding:7rem 1.5rem;background:var(--bg-el)}
.contact-layout{display:grid;grid-template-columns:1fr 1.5fr;gap:6rem;align-items:start;margin-top:3rem}
.contact-info-title{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.2;margin-bottom:1.25rem}
.contact-info p{color:var(--fg-m);font-size:.875rem;line-height:1.8;margin-bottom:2rem}
.contact-link{display:flex;align-items:center;gap:.75rem;color:var(--fg-m);font-size:.875rem;text-decoration:none;margin-bottom:.75rem;transition:color .2s}
.contact-link:hover{color:var(--fg)}
.contact-link-icon{width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--combat)}
.contact-note{margin-top:2rem;padding:1rem 1.25rem;border-left:2px solid var(--combat);background:rgba(196,21,21,.04)}
.contact-note p{font-size:.78rem;color:var(--fg-s);line-height:1.6;margin:0}
.form{display:flex;flex-direction:column;gap:.875rem}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.875rem}
.form-label{display:block;font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--fg-s);margin-bottom:.4rem}
.form-input,.form-textarea,.form-select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--fg);font-family:inherit;font-size:.875rem;padding:.85rem 1rem;transition:border-color .2s;-webkit-appearance:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--combat)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--fg-s)}
.form-textarea{resize:vertical;min-height:120px}
.form-select{color:var(--fg-m);cursor:pointer}
.form-select option{background:var(--bg)}
.form-check{display:flex;align-items:flex-start;gap:.6rem;font-size:.78rem;color:var(--fg-s);cursor:pointer}
.form-check input{margin-top:2px;accent-color:var(--combat)}
.form-submit{background:var(--combat);color:#fff;border:none;border-radius:4px;padding:1rem;font-family:inherit;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s;width:100%}
.form-submit:hover{background:var(--combat-h);transform:translateY(-1px)}
.form-note{font-size:.72rem;color:var(--fg-s);text-align:center}
#form-success{display:none;padding:1rem;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:4px;color:#4ade80;font-size:.85rem;text-align:center}
#form-error{display:none;padding:1rem;background:rgba(196,21,21,.08);border:1px solid rgba(196,21,21,.25);border-radius:4px;color:var(--combat);font-size:.85rem;text-align:center}

/* CTA FINAL */
#cta{position:relative;height:400px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.cta-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=1920&q=80') center/cover no-repeat}
.cta-overlay{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.cta-content{position:relative;z-index:10;max-width:560px;padding:2rem}
.cta-title{font-size:clamp(2rem,5vw,3rem);font-weight:900;letter-spacing:-.03em;margin-bottom:1rem}
.cta-lead{color:var(--fg-m);margin-bottom:2rem;line-height:1.7;font-size:.9rem}

/* FOOTER */
footer{padding:4rem 1.5rem 2rem;border-top:1px solid var(--border)}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:3rem;margin-bottom:3rem}
.footer-desc{color:var(--fg-s);font-size:.8rem;margin-top:.75rem;line-height:1.7}
.footer-section-title{font-size:.65rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-s);margin-bottom:1rem}
.footer-links{list-style:none;display:flex;flex-direction:column;gap:.5rem}
.footer-links a{color:var(--fg-s);text-decoration:none;font-size:.8rem;transition:color .2s}
.footer-links a:hover{color:var(--fg)}
.footer-contact-item{display:flex;align-items:center;gap:.5rem;color:var(--fg-s);font-size:.8rem;margin-bottom:.6rem;text-decoration:none}
.footer-contact-item:hover{color:var(--fg)}
.footer-bottom{border-top:1px solid var(--border);padding-top:1.5rem;display:flex;flex-wrap:wrap;justify-content:space-between;font-size:.72rem;color:var(--fg-s)}
.footer-bottom a{color:var(--fg-s);text-decoration:none}
.footer-bottom a:hover{color:var(--fg)}
.footer-legal{display:flex;gap:1.5rem}

.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);backdrop-filter:blur(12px);overflow-y:auto;padding:3rem 1.5rem}
.modal-overlay:target{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:var(--bg-el);border:1px solid var(--border);border-radius:6px;padding:3rem;max-width:680px;width:100%;margin:auto;position:relative}
.modal-close{position:absolute;top:1.25rem;right:1.25rem;background:var(--bg-surf);border:1px solid var(--border);color:var(--fg-m);width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:.9rem;transition:color .2s}
.modal-close:hover{color:var(--fg)}
.modal-box h2{font-size:1.4rem;font-weight:800;margin-bottom:1.5rem}
.modal-box h3{font-size:.85rem;font-weight:700;margin:1.5rem 0 .4rem;color:var(--combat);text-transform:uppercase;letter-spacing:.08em}
.modal-box p,.modal-box li{color:var(--fg-m);font-size:.82rem;line-height:1.85;margin-bottom:.5rem}
.modal-box ul{padding-left:1.25rem;margin-bottom:.75rem}


  /* RESPONSIVE COMPLET */
  @media(max-width:1024px){

    .pricing-table{overflow-x:auto}
    .pricing-row{grid-template-columns:1.5fr 1fr;min-width:360px}
    .pricing-row > div:nth-child(3),.pricing-row > div:nth-child(4){display:none}
    .stats-inner{gap:.5rem}
    .stat-num{font-size:1.6rem}
    .coach-badge{position:relative;right:auto;margin-top:1rem;display:inline-flex;gap:1rem;align-items:center;padding:.6rem 1rem}
    .coach-badge-num{font-size:1.8rem}
    .coach-map{height:260px}
    #cta{height:300px}
    .cta-title{font-size:1.8rem}
    .contact-layout{gap:2rem}
  }
  @media(max-width:480px){
    .container{padding:0 1rem}
    .header-inner{height:60px}
    .logo-img{height:44px}
    nav.desktop-nav{display:none}
    .hero-title{font-size:clamp(2rem,9vw,3rem);letter-spacing:-.03em}
    .hero-sub{font-size:.875rem}
    .hero-btns{flex-direction:column;gap:.75rem}
    .btn{justify-content:center}
    .stats-inner{grid-template-columns:repeat(3,1fr);display:grid;gap:.25rem}
    .section-title{font-size:1.8rem}
    .form-row{grid-template-columns:1fr}
    .location-inner{flex-direction:column;gap:.75rem;align-items:flex-start;padding:0 1rem}
    .packs-grid{gap:0}
    .pack-card{border-bottom:1px solid var(--border)}
    #back-to-top{bottom:1.25rem;right:1.25rem;width:40px;height:40px}
    .certif-grid{grid-template-columns:1fr}
    .course-block{height:260px}
  }
